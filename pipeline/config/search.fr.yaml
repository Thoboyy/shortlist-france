sources:
  # ---- Sources françaises ----------------------------------------------------
  francetravail:                    # API officielle France Travail (clé gratuite, cf. .env.example)
    enabled: true
    publiee_depuis: 7               # 1, 3, 7, 14 ou 31 jours
    max_pages: 2                    # 150 offres par page
    max_queries: 19
    delay_s: 0.3
    # type_contrat: "CDI"          # décommenter pour ne récupérer que des CDI (CDI, CDD, MIS, SAI, LIB…)
    # qualification: 9             # 9 = cadre
    passes:
      - { name: lyon-40km, commune: "69266", distance_km: 40 }   # Villeurbanne + 40 km (Lyon = 69123)
      - { name: france-teletravail, queries: ["IAM télétravail total", "IGA full remote",
                                              "identity access management télétravail", "Active Directory full remote"] }
    title_keywords: [iam, iga, pam, identit, "identity", sso, "active directory", annuaire, ldap, "entra",
                     "azure ad", okta, sailpoint, evidian, cyberark, saviynt, forgerock, keycloak, ping, wallix,
                     "habilitation", "gestion des accès", "access management", "sécurité", "securite", cyber,
                     "intégrat", integrat, "authentification", kerberos, pki]
    title_exclude: [stage, alternan, apprenti, technicien, commercial, "ingénieur d'affaires", "support n1",
                    "habilitation électrique", "habilitations électriques", "agent de sécurité", "agent de securite",
                    "sécurité incendie", "securite incendie", "ssiap", "sûreté", "surete", "sécurité alimentaire",
                    "hse", "qhse", "sécurité au travail", "prévention"]

  apec:                             # APEC.fr (cadres) — recherche JSON publique, sans clé
    enabled: true
    queries: ["IAM", "IGA", "gestion des identités", "Active Directory", "identity access management", "PAM", "SSO"]
    contrats: ["101888"]            # 101888 = CDI. Liste vide = tous contrats.
    teletravail: []                 # vide = tous modes (sur site, partiel, total) ; ["20767"] = télétravail total seul
    # lieux: []                     # ids de lieu APEC (relever dans la requête XHR d'une recherche sur apec.fr)
    results_per_page: 100
    max_pages: 3
    max_days_old: 7
    delay_s: 1.0
    title_keywords: [iam, iga, pam, identit, identity, sso, "active directory", annuaire, ldap, entra, okta, sailpoint,
                     evidian, cyberark, saviynt, forgerock, keycloak, "gestion des accès", "access management",
                     "sécurité", cyber, intégrat, kerberos, pki]
    title_exclude: [stage, alternan, commercial, "ingénieur d'affaires", directeur, directrice, "habilitation électrique",
                    "sécurité incendie", "hse", "qhse", "sûreté"]

  wttj:                             # Welcome to the Jungle (index Algolia public)
    enabled: true
    max_days_old: 7
    max_experience_years: 10
    hits_per_page: 200
    max_pages: 3
    queries: ["*"]
    passes:
      - name: lyon                  # bureaux à Lyon / Villeurbanne, tout mode de travail
        filters: "contract_type:full_time AND offices.country_code:FR AND (offices.city:Lyon OR offices.city:Villeurbanne OR offices.city:Écully OR offices.city:Limonest)"
        office_cities: [Lyon, Villeurbanne, Écully, Limonest]
        country_codes: [FR]
      - name: france-remote
        filters: "remote:fulltime AND contract_type:full_time AND offices.country_code:FR"
        country_codes: [FR]
    title_keywords: [iam, iga, pam, identit, identity, sso, "active directory", annuaire, ldap, entra, okta, sailpoint,
                     evidian, cyberark, saviynt, forgerock, keycloak, "access management", "sécurité", security,
                     cyber, "intégrat", integrat, kerberos, pki, "devsecops"]

  adzuna:                           # agrégateur ; même clé qu'au Canada, country=fr via profile.country
    enabled: true
    match: title
    where: [Lyon, France]           # passe locale (rayon) + passe nationale (le prefilter garde le télétravail)
    distance_km: 40
    pages: 2
    results_per_page: 50
    max_days_old: 7

  boards:                           # LinkedIn + Indeed France via python-jobspy (sans clé)
    enabled: true
    sites: [linkedin, indeed]
    country_indeed: france
    results_per_query: 30
    hours_old: 120
    max_queries: 19
    linkedin_fetch_description: false
    locations:
      - { location: "Lyon, Auvergne-Rhône-Alpes, France" }
      - { location: "France", remote_only: true, max_queries: 10 }   # télétravail total, toute la France

  serper:                           # Google via serper.dev — job boards FR non couverts par une API
    enabled: true
    queries_per_run: 30
    results_per_query: 10
    recency: qdr:w
    plan:
      - { suffix: "site:hellowork.com/fr-fr/emplois Lyon", queries: default }
      - { suffix: "site:free-work.com/fr/tech-it (Lyon OR télétravail) CDI", queries: default }
      - { suffix: "site:cadremploi.fr/emploi/detail_offre Lyon", queries: default }
      - { suffix: "site:meteojob.com Lyon", queries: default }
      - { suffix: "(site:jobs.lever.co OR site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.smartrecruiters.com) (Lyon OR France)", queries: default }
      - { suffix: "(site:teamtailor.com OR site:welcomekit.co) (Lyon OR France)", queries: default }

  workable_search:                  # jobs.workable.com — très utilisé par les PME européennes
    enabled: true
    day_range: 7
    max_queries: 10
    max_pages: 2
    pause_s: 0.8
    passes:
      - { location: Lyon, country: France }
      - { location: France, workplace: remote, country: France }
    title_keywords: [iam, iga, pam, identit, identity, sso, "active directory", ldap, entra, okta, sailpoint,
                     cyberark, "access management", security, sécurité, cyber, integrat, intégrat]

  # ---- Sources non pertinentes pour la France (désactivées) --------------
  jooble: { enabled: false }
  jobbank: { enabled: false }
  remotive: { enabled: false }
  remoteok: { enabled: false }
  jobicy: { enabled: false }
  themuse: { enabled: false }
  weworkremotely: { enabled: false }
  himalayas: { enabled: false }
  workday: { enabled: false }
  eluta: { enabled: false }
  ats_companies: { enabled: false }
  yc: { enabled: false }
  amazon: { enabled: false }
  hn: { enabled: false }
  successfactors: { enabled: false }
  getro: { enabled: false }
  remoterocketship: { enabled: false }
  workingnomads: { enabled: false }
  gcjobs: { enabled: false }
  bcps: { enabled: false }

# `autojob companies news` — communiqués de recrutement (serper /news, quelques crédits)
discovery:
  news_queries:
    - "Lyon recrutement cybersécurité"
    - "ESN Lyon recrute IAM"
    - "ouverture agence Lyon recrutement ingénieurs"
