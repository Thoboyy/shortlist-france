# ---------------------------------------------------------------------------
# autojob — configuration MARCHÉ FRANÇAIS (2026-10)
#
# Activation :  AUTOJOB_CONFIG=./config/search.fr.yaml  (dans pipeline/.env)
# Profil      :  copier profile.example.fr/ vers profile/ puis l'adapter.
#
# Pré-rempli pour : consultant / ingénieur IAM-IGA-annuaires, basé à Villeurbanne,
# CDI, sur site/hybride dans le 69/01/38 ou télétravail total en France.
# Pour un autre métier : modifier `queries`, les `title_keywords` des sources, les familles
# de `scoring.v2` et prompts/scorer_v2.fr.md (section 1).
# ---------------------------------------------------------------------------

profile:
  location: "Villeurbanne, France"
  country: FR                       # Adzuna → api.adzuna.com/v1/api/jobs/fr, salaires en EUR
  language: fr                      # prompts *.fr.md, digest Telegram et dates en français
  timezone: Europe/Paris
  dashboard_url: "http://localhost:3100/pipeline/jobs"

# Requêtes envoyées aux sources « par mots-clés » (France Travail, Adzuna, LinkedIn/Indeed, Serper,
# Workable). Courtes : les sites font du fuzzy matching. L'ORDRE COMPTE : les sources plafonnées
# prennent les N premières.
queries:
  - consultant IAM
  - ingénieur IAM
  - consultant IGA
  - gestion des identités
  - identity access management
  - ingénieur Active Directory
  - consultant cybersécurité IAM
  - PAM CyberArk
  - SSO fédération identité
  - Evidian
  - SailPoint
  - ingénieur annuaire LDAP
  - architecte IAM
  - ingénieur sécurité identité
  - consultant Okta Entra ID
  - ingénieur intégration sécurité
  - Saviynt
  - ForgeRock
  - Keycloak

scoring:
  min_score_to_queue: 7
  version: 2
  v2:
    family_base: { target: 6, adjacent: 4, 'off': 2 }
    duties_match: { 0: -3, 1: -1, 2: 0, 3: 1 }
    # Profil confirmé : senior n'est plus pénalisé ; lead/architecte légèrement ; direction exclue.
    seniority: { entry: -1, junior: 0, mid: 1, senior: 0, lead: -1, manager: -1, executive: -5 }
    years_required: { le2: 0, eq3: 1, eq4: 1, ge5: 0, ge8: -2 }
    missing_must_have: -1
    signals_cap: 2
    # ESN = marché IAM dominant en France : neutre. Éditeur IAM = bonus.
    employer: { startup: 0, smb: 1, enterprise: 1, esn: 0, editor: 1, public_sector: 0, unknown: 0 }
    # Familles (doivent correspondre aux identifiants de prompts/scorer_v2.fr.md)
    target_families: [iam_iga, directory_infra, security_integration, it_integration]
    adjacent_families: [cyber_grc, soc_detection, systems_admin, cloud_devsecops, technical_project_lead,
                        presales_solutions, software_dev, data_dba]
    hard_off_families: [helpdesk_support, sales_quota, data_science_ml, hr_recruiting, trades_field_physical,
                        retail_hospitality, call_center, healthcare_clinical, finance_accounting]
    signals_allowed: [tool_overlap, candidate_domain, telework, end_client, certification_match, ownership]
    # Contrats exclus (→ note ≤ 3). Retirer `freelance` pour accepter missions en TJM / portage.
    not_permanent: [contract, freelance, temporary, part_time, internship, apprenticeship]
    skip_seniority: [executive]          # « senior » et « lead » restent notés, pas exclus
    skip_years_at_least: 12              # exclusion dure seulement au-delà de 12 ans exigés
    citizenship_reason: "habilitation défense / nationalité requise"
  max_llm_calls_per_run: 600
  free_quota_reserve: 250
  quota_recheck_every: 100
  max_scrapes_per_run: 400
  workers: 4
  # Mêmes modèles que la config d'origine (OpenRouter). Ils lisent/écrivent le français sans souci.
  models:
    - { name: nvidia/nemotron-3.5-lightning,          rpm: 60, reasoning: "off", max_tokens: 2000 }
    - { name: nvidia/nemotron-3-ultra-550b-a55b:free, rpm: 20, reasoning: "off", max_tokens: 2000 }
    - { name: deepseek/deepseek-v4-flash,             rpm: 60, reasoning: "off", max_tokens: 2000 }
    - { name: poolside/laguna-s-2.1:free,             rpm: 20, reasoning: "off", max_tokens: 2000 }
    - { name: google/gemma-4-31b-it:free,             rpm: 20 }
    - { name: openrouter/free,                        rpm: 20 }
  docs_models:
    - { name: nvidia/nemotron-3-ultra-550b-a55b:free, rpm: 20 }
    - { name: poolside/laguna-s-2.1:free,             rpm: 20 }
    - { name: nvidia/nemotron-3.5-lightning,          rpm: 60 }

expiry:
  posted_max_days: 30
  fetched_max_days: 45
  link_checks_per_run: 60

digest_ranking:
  freshness_bonus: 1.0
  low_confidence_penalty: 1.0
  # À recalculer après quelques semaines d'usage (voir la requête dans config/search.yaml).
  source_priors:
    francetravail: 0.5
    apec: 0.5
    wttj: 0.5

# Rejets par règles AVANT tout appel LLM. Haute précision uniquement.
prefilter:
  title_allow_phrases:
    - chef de projet
    - cheffe de projet
    - chef·fe de projet
    - ingénieur sécurité
    - ingénieure sécurité
    - architecte iam
    - architecte identité
  title_exclude_words:              # mot entier, insensible à la casse (pluriel s/es inclus)
    - stage
    - stagiaire
    - alternance
    - alternant
    - alternante
    - apprenti
    - apprentie
    - apprentissage
    - intern
    - internship
    - technicien
    - technicienne
    - helpdesk
    - "help desk"
    - commercial
    - commerciale
    - vendeur
    - vendeuse
    - "business developer"
    - directeur
    - directrice
    - dsi
    - rssi
    - "head of"
    - vp
    - cto
    - ciso
    - professeur
    - formateur
    - formatrice
    - recruteur
    - recruteuse
    - "chargé de recrutement"
    - "chargée de recrutement"
    - "talent acquisition"
    - comptable
    - infirmier
    - infirmière
    - chauffeur
    - magasinier
    - cariste
    - électricien
    - plombier
    - soudeur
  title_exclude_phrases:            # sous-chaîne, insensible à la casse
    - "support n1"
    - "support niveau 1"
    - "technicien de proximité"
    - "ingénieur d'affaires"
    - "ingénieure d'affaires"
    - "account executive"
    - "account manager"
    - "sales "
    - "data scientist"
    - "analyste soc n1"
  employment_type_exclude: [stage, internship, intern, alternance, apprentissage, apprenticeship, "contrat pro",
                            intérim, interim, "MIS", "temps partiel", part-time, saisonnier, seasonal, temporary]
                            # CDD et freelance ne sont PAS exclus ici : le scorer les marque (not_permanent).
                            # Ajouter cdd / CDD / freelance / LIB pour les couper avant le LLM.
  max_posted_age_days: 30
  company_blocklist:
    enabled: true
    min_dismissals: 2
  employer_block_words: []          # ex. [université, "pôle emploi", mairie] — vide par défaut
  location:
    # Règles (autojob/prefilter.py) :
    #  1. ville de deny_cities, sur site (pas de mention télétravail), sans ville locale → rejet
    #  1b. département hors local_departements, sur site ou hybride → rejet (« Nanterre (92) », « 75008 Paris »)
    #  2. États-Unis sur site / résidence US exigée → rejet
    #  3. pays/région étrangère sans mention France ni « worldwide » → rejet
    # Les offres sans lieu passent toujours (le LLM tranche).
    home_markers: [france, "télétravail total", "full remote france", "remote france",
                   lyon, villeurbanne, auvergne-rhône-alpes, auvergne-rhone-alpes]
    local_markers: [lyon, villeurbanne, vénissieux, venissieux, bron, vaulx-en-velin, caluire, écully, ecully,
                    dardilly, limonest, "champagne-au-mont-d'or", saint-priest, saint-fons, oullins, tassin,
                    "sainte-foy-lès-lyon", rillieux, "décines", decines, meyzieu, "chassieu", "la part-dieu",
                    "part dieu", gerland, "vaise", "techlid", "sophia"]   # « sophia » à retirer si non pertinent
    local_departements: ["69", "01", "38"]
    deny_cities:                    # grandes villes / régions sans code département dans le libellé
      - paris
      - "île-de-france"
      - "ile-de-france"
